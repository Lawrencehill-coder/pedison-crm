<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:Arial,sans-serif;color:#20324a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#152c48;color:white;padding:24px 4%}header h1{margin:3px 0;font-size:27px}header p{color:#c6d5e5;margin:0}nav{display:flex;gap:8px;padding:15px 4%;background:white;border-bottom:1px solid #dae2eb;flex-wrap:wrap}button{border:0;border-radius:7px;background:#235a89;color:white;padding:10px 16px;cursor:pointer;font-weight:600}button.secondary{background:#e7eef5;color:#1a3858}button.active{background:#152c48}main{max-width:1320px;margin:auto;padding:25px 4%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:white;border:1px solid #e0e7ef;border-radius:12px;padding:20px}.stat b{font-size:30px;display:block;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.wide{grid-column:1/-1}label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd6e2;border-radius:7px;background:white;font:inherit}textarea{min-height:78px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e4e9f0}th{color:#61748b;background:#f8fafc}.scroll{overflow:auto}.muted{color:#65758b}.note{background:#fff8e8;padding:12px;border-left:3px solid #d9a346;margin:12px 0}.section{border-top:1px solid #e5eaf0;padding-top:15px;margin-top:20px}#notice{margin:10px 4%;font-weight:600}footer{padding:25px 4%;color:#718097;font-size:12px}@media(max-width:760px){.stats,.grid,.formgrid{grid-template-columns:1fr}header h1{font-size:22px}}
@media print{nav,button,#notice,.no-print{display:none!important}main{padding:0}.panel{border:0}.formgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div style="letter-spacing:2px;font-size:12px">PEDISON USA CORPORATION</div><h1>Funding & Corporate Credit Builder CRM</h1><p>Pedison Funding Platform · NCCB Credit Builder · Unified Intake & Pipeline</p></header>
<nav><button onclick="show('dashboard')" id="nav-dashboard">Overview</button><button onclick="show('leads')" id="nav-leads">Prospects</button><button onclick="show('new')" id="nav-new">New Prospect</button><button onclick="show('intake')" id="nav-intake">Applications</button><button onclick="show('tasks')" id="nav-tasks">Activities & Tasks</button></nav><div id="notice" role="status"></div><main id="app"></main><footer>Internal CRM. No financing guarantees. Do not enter SSNs, birth dates, passwords or full financial account numbers.</footer>
<script>
let db={leads:[],applications:[],tasks:[],stages:[],tracks:[],summary:{}},page='dashboard';
const loan=[['Funding request','requestedAmount','number'],['Requested product','product','select','Business term loan|Business line of credit|Equipment financing|Commercial real estate|Business credit card|Other'],['Use of proceeds','purpose','textarea'],['Requested term (months)','termMonths','number'],['Annual gross revenue','annualRevenue','number'],['Prior year revenue','priorYearRevenue','number'],['Years in business','yearsOperating','number'],['Legal entity type','entityType','text'],['EIN last four digits (optional)','einLast4','text'],['Industry','industry','text'],['Employee count','employees','number'],['Business address','businessAddress','text'],['Website','businessWebsite','text'],['Existing business debt summary','existingDebt','textarea'],['Monthly debt service','monthlyDebtService','number'],['Available collateral','collateral','textarea'],['Business credit profile summary','creditProfile','textarea'],['Funding timeline','fundingTimeline','text'],['Owner name','ownerName','text'],['Owner title','ownerTitle','text'],['Ownership percentage','ownershipPercent','number'],['Contact phone','contactPhone','tel'],['Contact email','contactEmail','email'],['Additional notes','additionalNotes','textarea']];
const nccb=[['DBA','dba'],['Website','website'],['Business start date','startDate','date'],['Employees including owners','employees','number'],['Business street address','streetAddress'],['Mailing address','mailingAddress'],['Business description','businessDescription','textarea'],['Billing/payment terms','paymentTerms'],['Sales territory','salesTerritory'],['Primary customer types','customerTypes'],['Legal structure','entityType'],['Incorporation date','incorporationDate','date'],['Incorporation state','incorporationState'],['Trade style registration','tradeStyleRegistered'],['Current annual revenue','revenueCurrent','number'],['Prior year revenue','revenuePrior','number'],['Projected annual revenue','revenueProjected','number']];
for(let i=1;i<=3;i++)for(let [label,key,type] of [['Name','Name'],['Title','Title'],['Ownership %','Ownership','number'],['Education / degree','Education'],['Work experience / history','Experience','textarea'],['Other businesses owned','OtherBusinesses','textarea']])nccb.push(['Owner '+i+' — '+label,'owner'+i+key,type]);
for(let i=1;i<=16;i++)for(let [label,key,type] of [['Vendor name','Name'],['Contact','Contact'],['Phone','Phone','tel'],['Email','Email','email'],['Account reference (non-sensitive only)','AccountRef'],['Vendor bureau number','Bureau'],['Mailing address','Address'],['Products / services','Product'],['Credit limit','Limit','number']])nccb.push(['Reference '+i+' — '+label,'vendor'+i+key,type]);
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function call(fn,args,done){document.getElementById('notice').textContent='Working…';google.script.run.withSuccessHandler(x=>{document.getElementById('notice').textContent='';done&&done(x)}).withFailureHandler(e=>{document.getElementById('notice').textContent='Error: '+e.message})[fn](args)}
function refresh(next){call('getDashboard',undefined,r=>{db=r;show(next||page)})}
function show(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+p));let el=document.getElementById('app');if(p==='dashboard')el.innerHTML=dashboard();if(p==='leads')el.innerHTML=leads();if(p==='new')el.innerHTML=newLead();if(p==='intake')el.innerHTML=intake();if(p==='tasks')el.innerHTML=tasks()}
function dashboard(){let s=db.summary;return '<div class="stats">'+[['Prospects',s.leads],['Applications',s.applications],['Open tasks',s.openTasks],['Funded',s.funded]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><div class="grid" style="margin-top:20px"><section class="panel"><h2>Funding Platform</h2><p>Business loans, lines of credit, equipment financing and corporate credit products. Intake → Qualification → Underwriting review.</p><button onclick="show(\'new\')">Add funding prospect</button></section><section class="panel"><h2>Corporate Credit Builder</h2><p>NCCB business profile, ownership background and vendor trade references, with a separate credit-building intake.</p><button onclick="show(\'intake\')">Open NCCB application</button></section></div><div class="panel" style="margin-top:18px"><h2>Recent prospects</h2>'+leadTable(db.leads.slice(0,8))+'</div>'}
function leadTable(arr){return '<div class="scroll"><table><thead><tr><th>Company</th><th>Contact</th><th>Track</th><th>Stage</th><th>Email</th></tr></thead><tbody>'+arr.map(x=>'<tr><td>'+escapeHtml(x.company)+'</td><td>'+escapeHtml(x.contact)+'</td><td>'+escapeHtml(x.track)+'</td><td><select aria-label="Pipeline stage" onchange="stage(\''+escapeHtml(x.id)+'\',this.value)">'+db.stages.map(s=>'<option '+(s===x.stage?'selected':'')+'>'+escapeHtml(s)+'</option>').join('')+'</select></td><td>'+escapeHtml(x.email)+'</td></tr>').join('')+'</tbody></table></div>'}
function leads(){return '<section class="panel"><h2>Prospect pipeline</h2>'+leadTable(db.leads)+'</section>'}
function newLead(){return '<section class="panel"><h2>Create prospect</h2><form id="leadform" onsubmit="saveLead(event)" class="formgrid">'+[['Company name','company','text'],['Primary contact','contact','text'],['Email','email','email'],['Phone','phone','tel'],['Source','source','text'],['Notes','notes','textarea']].map(field).join('')+'<div class="wide"><label>Platform</label><select name="track">'+db.tracks.map(t=>'<option>'+escapeHtml(t)+'</option>').join('')+'</select></div><button type="submit">Save prospect</button></form></section>'}
function field(x){let [label,key,type='text',opts]=x;return '<div><label for="'+key+'">'+escapeHtml(label)+'</label>'+(type==='textarea'?'<textarea id="'+key+'" name="'+key+'"></textarea>':type==='select'?'<select id="'+key+'" name="'+key+'">'+opts.split('|').map(t=>'<option>'+escapeHtml(t)+'</option>').join('')+'</select>':'<input id="'+key+'" name="'+key+'" type="'+type+'" '+(type==='number'?'min="0" step="any"':'')+'>')+'</div>'}
function saveLead(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));call('addLead',d,()=>refresh('leads'))}
function stage(id,value){document.getElementById('notice').textContent='Working…';google.script.run.withSuccessHandler(()=>{document.getElementById('notice').textContent='';refresh('leads')}).withFailureHandler(e=>{document.getElementById('notice').textContent='Error: '+e.message}) .updateStage(id,value)}
function intake(){return '<section class="panel"><h2>New application</h2><div class="note">Select an existing prospect. The intake uses the same CRM record and does not duplicate the lead. Do not enter Social Security numbers or dates of birth.</div><div class="formgrid"><div><label>Prospect</label><select id="appLead" onchange="renderFields()"><option value="">Select prospect</option>'+db.leads.map(x=>'<option value="'+escapeHtml(x.id)+'">'+escapeHtml(x.company)+' — '+escapeHtml(x.track)+'</option>').join('')+'</select></div></div><div id="appFields"></div></section>'}
function renderFields(){let lead=db.leads.find(x=>x.id===document.getElementById('appLead').value),el=document.getElementById('appFields');if(!lead){el.innerHTML='';return}let list=lead.track==='Business Loan'?loan:nccb;let html='<form id="application" onsubmit="saveApplication(event)"><h3>'+escapeHtml(lead.track)+' — '+escapeHtml(lead.company)+'</h3><div class="formgrid">';for(let i=0;i<list.length;i++){if(lead.track==='NCCB Credit Builder'&&i>=35&&(i-35)%9===0)html+='</div><h3 class="section">Vendor reference '+(Math.floor((i-35)/9)+1)+'</h3><div class="formgrid">';html+=field(list[i])}html+='</div><div class="section"><label><input type="checkbox" name="certification" value="yes" required style="width:auto"> I certify that the information supplied is accurate to the best of my knowledge and understand this is not a credit approval or authorization to obtain a credit report.</label><p class="muted">Signature and sensitive identity verification, when needed, must be completed through an approved secure process.</p><button type="submit">Save application</button> <button type="button" class="secondary" onclick="window.print()">Print / Save PDF</button></div></form>';el.innerHTML=html}
function saveApplication(e){e.preventDefault();let lead=db.leads.find(x=>x.id===document.getElementById('appLead').value),fields=Object.fromEntries(new FormData(e.target));call('submitApplication',{leadId:lead.id,track:lead.track,fields},r=>{alert('Application recorded: '+r.id);refresh('intake')})}
function tasks(){return '<div class="grid"><section class="panel"><h2>Log activity</h2><form onsubmit="saveActivity(event)" class="formgrid">'+leadSelect()+'<div><label>Type</label><select name="type"><option>Call</option><option>Email</option><option>Meeting</option><option>Note</option></select></div>'+field(['Description','description','textarea'])+'<button>Save activity</button></form></section><section class="panel"><h2>Add follow-up</h2><form onsubmit="saveTask(event)" class="formgrid">'+leadSelect()+field(['Due date','dueDate','date'])+field(['Task description','description','textarea'])+'<button>Save task</button></form></section></div><section class="panel" style="margin-top:18px"><h2>Follow-up queue</h2><div class="scroll"><table><tr><th>Due</th><th>Prospect</th><th>Task</th><th>Status</th></tr>'+db.tasks.map(t=>'<tr><td>'+escapeHtml(t.dueDate)+'</td><td>'+escapeHtml(db.leads.find(l=>l.id===t.leadId)?.company||t.leadId)+'</td><td>'+escapeHtml(t.description)+'</td><td>'+escapeHtml(t.status)+'</td></tr>').join('')+'</table></div></section>'}
function leadSelect(){return '<div><label>Prospect</label><select name="leadId" required>'+db.leads.map(l=>'<option value="'+escapeHtml(l.id)+'">'+escapeHtml(l.company)+'</option>').join('')+'</select></div>'}
function saveActivity(e){e.preventDefault();call('addActivity',Object.fromEntries(new FormData(e.target)),()=>refresh('tasks'))}
function saveTask(e){e.preventDefault();call('addTask',Object.fromEntries(new FormData(e.target)),()=>refresh('tasks'))}
refresh('dashboard');
</script></body></html>
